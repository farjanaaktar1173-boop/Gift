<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gift Panel</title>
<style>
:root{
  --bg:#06060e;
  --pink:#ff2a74;
  --violet:#8b5cf6;
  --cyan:#22d3ee;
  --gold:#ffd166;
  --text:#fff;
  --muted:rgba(255,255,255,.55);
  --border:rgba(255,255,255,.10);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,-apple-system,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);height:100vh;width:100vw;overflow:hidden;display:flex;justify-content:center;align-items:center;position:relative}

body::before{
  content:'';position:fixed;inset:-60%;
  background:conic-gradient(from 0deg,#ff2a74,#8b5cf6,#22d3ee,#ff7e5f,#ff2a74);
  filter:blur(150px);opacity:.18;
  animation:auroraSpin 30s linear infinite;z-index:-2;
}
@keyframes auroraSpin{to{transform:rotate(360deg)}}
body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,42,116,.10),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(34,211,238,.10),transparent 60%);
  z-index:-1;pointer-events:none;
}

#particles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#particles span{position:absolute;bottom:-70px;animation:floatUp linear infinite;will-change:transform}
@keyframes floatUp{0%{transform:translateY(0) rotate(0) scale(1)}100%{transform:translateY(-120vh) rotate(360deg) scale(1.15)}}

.popup-container{position:fixed;left:50%;bottom:0;width:min(100vw,560px);height:62vh;min-height:380px;transform:translate(-50%,110%);background:linear-gradient(180deg,rgba(26,26,40,.98),rgba(12,12,20,.99));backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-radius:32px 32px 0 0;border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -28px 80px rgba(0,0,0,.80),inset 0 1px 0 rgba(255,255,255,.10);transition:transform .55s cubic-bezier(.175,.885,.32,1.275);z-index:100;display:flex;flex-direction:column;padding:10px 16px 16px;overflow:hidden}
.popup-container.active{transform:translate(-50%,0)}
.popup-container::before{content:'';position:absolute;top:0;left:14%;right:14%;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,var(--pink),var(--cyan),transparent);opacity:.95}

.grabber{width:48px;height:4px;border-radius:99px;background:rgba(255,255,255,.20);margin:2px auto 12px;flex:0 0 auto}

.popup-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.header-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.header-title h2{font-size:15.5px;font-weight:800;letter-spacing:.3px;background:linear-gradient(135deg,#fff,#ffb3cf);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.header-title p{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.diamond-balance{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;font-weight:800;font-size:13.5px;color:#9beeff;background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(34,211,238,.05));border:1px solid rgba(34,211,238,.35);box-shadow:0 0 20px rgba(34,211,238,.22),inset 0 0 12px rgba(34,211,238,.08);white-space:nowrap}
.diamond-balance .gem{font-size:14px;filter:drop-shadow(0 0 6px rgba(34,211,238,.9));animation:gemGlow 2.2s ease-in-out infinite}
@keyframes gemGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}

.gift-grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:130px;gap:12px;padding:16px 4px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,42,116,.6) transparent;align-content:start}
.gift-grid::-webkit-scrollbar{width:4px}
.gift-grid::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff2a74,#8b5cf6);border-radius:99px}

.gift-card{position:relative;width:100%;height:100%;border-radius:22px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 5px;cursor:pointer;overflow:hidden;transition:transform .38s cubic-bezier(.175,.885,.32,1.275),box-shadow .35s ease,border-color .35s ease,background .35s ease;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.gift-card::after{content:'';position:absolute;top:0;left:-130%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);transform:skewX(-22deg);transition:left .7s ease;pointer-events:none}
.gift-card:active{transform:scale(.95)}
.gift-card.selected::after{left:140%}
.gift-card.selected{border-color:rgba(255,42,116,.95);background:linear-gradient(160deg,rgba(255,42,116,.26),rgba(139,92,246,.16));transform:translateY(-3px) scale(1.02);box-shadow:0 0 0 1px rgba(255,42,116,.55),0 14px 34px rgba(255,42,116,.42),inset 0 0 24px rgba(255,42,116,.18)}

.gift-card.premium{background:linear-gradient(160deg,rgba(255,209,102,.15),rgba(255,42,116,.12)),linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,209,102,.45);box-shadow:0 6px 22px rgba(255,180,60,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.gift-card.premium::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(135deg,#ffd166,#ff2a74,#8b5cf6,#ffd166);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.75;pointer-events:none;animation:premiumBorder 3s linear infinite;background-size:300% 300%}
@keyframes premiumBorder{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.gift-card.premium.selected{border-color:rgba(255,209,102,.95);background:linear-gradient(160deg,rgba(255,209,102,.30),rgba(255,42,116,.22));box-shadow:0 0 0 1px rgba(255,209,102,.85),0 16px 40px rgba(255,180,60,.55),inset 0 0 26px rgba(255,209,102,.28)}
.gift-card.premium .premium-star{position:absolute;top:7px;left:7px;font-size:12px;filter:drop-shadow(0 0 5px rgba(255,209,102,.95));animation:starTwinkle 1.8s ease-in-out infinite;z-index:2}
@keyframes starTwinkle{0%,100%{transform:scale(1) rotate(0deg);opacity:1}50%{transform:scale(1.25) rotate(15deg);opacity:.75}}

.image-wrapper{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.22),rgba(255,255,255,.03) 70%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 16px rgba(255,255,255,.08);overflow:hidden;transition:transform .38s cubic-bezier(.175,.885,.32,1.275),box-shadow .35s;flex:0 0 auto}
.gift-card.selected .image-wrapper{transform:scale(1.10);border-color:rgba(255,42,116,.75);box-shadow:0 0 24px rgba(255,42,116,.60),inset 0 0 16px rgba(255,42,116,.28)}
.gift-img{width:100%;height:100%;object-fit:cover;display:block}

.emoji-circle{position:relative;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;line-height:1;overflow:hidden;transition:transform .38s cubic-bezier(.175,.885,.32,1.275),box-shadow .4s ease;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));flex:0 0 auto}
.emoji-circle span{display:block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;transform:translateY(-1px);animation:emojiBreathe 3.4s ease-in-out infinite}
@keyframes emojiBreathe{0%,100%{transform:translateY(-1px) scale(1)}50%{transform:translateY(-1px) scale(1.06)}}
.halo-rose{background:radial-gradient(circle at 30% 25%,#ffd7e4,#ff7aa2 55%,#c9165a 100%)}
.halo-tulip{background:radial-gradient(circle at 30% 25%,#ffe1f0,#f78ccc 55%,#a91f74 100%)}
.halo-blossom{background:radial-gradient(circle at 30% 25%,#ffe7f1,#ffa8c8 55%,#d14788 100%)}
.halo-sunflower{background:radial-gradient(circle at 30% 25%,#fff2b6,#ffd166 55%,#cc8a00 100%)}
.halo-hibiscus{background:radial-gradient(circle at 30% 25%,#ffd4d4,#ff7373 55%,#c1121f 100%)}
.halo-hand{background:radial-gradient(circle at 30% 25%,#d9f7ff,#6cd0ff 55%,#0b6fb0 100%)}
.halo-heart{background:radial-gradient(circle at 30% 25%,#ffd7dd,#ff5c86 55%,#b51133 100%)}
.emoji-circle::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.55),transparent 45%);pointer-events:none}
.gift-card.selected .emoji-circle{transform:scale(1.10);box-shadow:0 0 24px rgba(255,42,116,.60),0 0 42px rgba(255,209,102,.35),inset 0 0 16px rgba(255,255,255,.28)}

.gift-price{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:#8fe9ff;padding:3px 9px;border-radius:999px;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.28);transition:.3s;white-space:nowrap}
.gift-card.selected .gift-price{color:#fff;background:linear-gradient(135deg,rgba(255,42,116,.45),rgba(255,126,95,.35));border-color:rgba(255,42,116,.7);box-shadow:0 0 14px rgba(255,42,116,.5)}
.gift-card.premium .gift-price{color:#ffe28a;background:linear-gradient(135deg,rgba(255,209,102,.20),rgba(255,42,116,.12));border-color:rgba(255,209,102,.55);box-shadow:0 0 12px rgba(255,209,102,.30)}
.gift-card.premium.selected .gift-price{color:#fff;background:linear-gradient(135deg,rgba(255,209,102,.55),rgba(255,42,116,.45));border-color:rgba(255,209,102,.85);box-shadow:0 0 16px rgba(255,209,102,.65)}

.check-badge{position:absolute;top:6px;right:6px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff2a74,#ff7e5f);box-shadow:0 4px 12px rgba(255,42,116,.65);transform:scale(0) rotate(-90deg);opacity:0;transition:transform .4s cubic-bezier(.175,.885,.32,1.5),opacity .3s;z-index:2}
.gift-card.selected .check-badge{transform:scale(1) rotate(0deg);opacity:1}
.gift-card.premium .check-badge{background:linear-gradient(135deg,#ffd166,#ff7e5f);box-shadow:0 4px 14px rgba(255,209,102,.75)}

.popup-footer{padding-top:12px;border-top:1px solid rgba(255,255,255,.07);flex:0 0 auto}
.send-btn{position:relative;width:100%;padding:15px;font-size:15px;font-weight:900;letter-spacing:.6px;color:#fff;border:none;border-radius:18px;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,#ff2a74,#ff7e5f,#ff2a74);background-size:220% 100%;box-shadow:0 10px 30px rgba(255,42,116,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:opacity .3s ease,filter .3s ease,transform .2s ease}
.send-btn:active{transform:scale(.97)}
.send-btn.active{opacity:1;pointer-events:auto;animation:btnShine 2.6s linear infinite}
@keyframes btnShine{0%{background-position:0% 50%}100%{background-position:220% 50%}}
.send-btn:not(.active){opacity:.35;filter:grayscale(.85);pointer-events:none}

.toast{position:fixed;top:26px;left:50%;transform:translate(-50%,-24px);padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:700;color:#fff;background:linear-gradient(135deg,rgba(255,42,116,.95),rgba(255,126,95,.95));box-shadow:0 12px 34px rgba(255,42,116,.5);opacity:0;visibility:hidden;transition:.35s cubic-bezier(.175,.885,.32,1.275);z-index:999999;white-space:nowrap}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

@media (max-height:640px){.popup-container{height:68vh}}
@media (max-width:360px){.gift-grid{grid-auto-rows:120px}.image-wrapper,.emoji-circle{width:52px;height:52px}.emoji-circle{font-size:28px}}
</style>
</head>
<body>

<div id="particles"></div>

<div class="popup-container active" id="popup">
  <div class="grabber"></div>

  <div class="popup-header">
    <div class="header-title">
      <h2 id="giftTitle">গিফট পাঠান 🌹</h2>
      <p id="giftSubtitle">পছন্দের গিফটে টাচ করুন</p>
    </div>
    <div class="diamond-balance">
      <span class="gem">💎</span>
      <span id="diamondCount">0</span>
    </div>
  </div>

  <div class="gift-grid" id="giftGrid">

    <div class="gift-card premium" onclick="selectGift(this,100,'📽️',true)">
      <span class="premium-star">⭐</span>
      <span class="check-badge">✓</span>
      <div class="image-wrapper">
        <img class="gift-img" src="https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/1ec9b0e3ccf773b2467a804456f096385a2798d1/1791000761663.jpg" alt="Premium Gift">
      </div>
      <div class="gift-price">💎 100</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,5,'🌹')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-rose"><span>🌹</span></div>
      <div class="gift-price">💎 5</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,5,'🌷')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-tulip"><span>🌷</span></div>
      <div class="gift-price">💎 5</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,10,'🌸')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-blossom"><span>🌸</span></div>
      <div class="gift-price">💎 10</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,10,'🌻')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-sunflower"><span>🌻</span></div>
      <div class="gift-price">💎 10</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,10,'🌺')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-hibiscus"><span>🌺</span></div>
      <div class="gift-price">💎 10</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,15,'🤝')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-hand"><span>🤝</span></div>
      <div class="gift-price">💎 15</div>
    </div>

    <div class="gift-card" onclick="selectGift(this,15,'💖')">
      <span class="check-badge">✓</span>
      <div class="emoji-circle halo-heart"><span>💖</span></div>
      <div class="gift-price">💎 15</div>
    </div>

  </div>

  <div class="popup-footer">
    <button class="send-btn" id="sendBtn" onclick="sendGift()">গিফট পাঠান</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

/* ============ FIREBASE ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
  authDomain: "room-7fbf7.firebaseapp.com",
  databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
  projectId: "room-7fbf7",
  storageBucket: "room-7fbf7.firebasestorage.app",
  messagingSenderId: "417946695868",
  appId: "1:417946695868:web:564bb9c8a06f7c90b2b8b9"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ============ URL PARAMS ============ */
const params = new URLSearchParams(location.search);
const IS_EMBEDDED = window.self !== window.top;
const TARGET_UID = params.get('targetUid') || '';
const TARGET_NAME = params.get('targetName') || '';

/* ============ STATE ============ */
let myUid = '';
let myName = '';
let currentDiamonds = 0;
let selectedPrice = 0;
let selectedElement = null;
let isVideoGift = false;
let selectedEmoji = '💖';
let selectedGiftName = 'Gift';
let selectedImageUrl = '';

const sendBtn = document.getElementById('sendBtn');
const diamondDisplay = document.getElementById('diamondCount');
const toastEl = document.getElementById('toast');

/* ============ LOAD USER FROM LOCALSTORAGE ============ */
(async function init(){
  try {
    const s = localStorage.getItem('moi_user');
    if (s){
      const u = JSON.parse(s);
      if (u && u.uid){
        myUid = u.uid;
        myName = u.name || 'User';
        currentDiamonds = u.diamonds ?? 0;
      }
    }
  } catch(e){}

  /* Fresh diamonds from Firestore */
  if (myUid){
    try {
      const snap = await getDoc(doc(db, 'users', myUid));
      if (snap.exists()){
        const u = snap.data();
        currentDiamonds = u.diamonds ?? currentDiamonds;
        myName = u.name || myName;
      }
    } catch(e){}
  }

  diamondDisplay.textContent = currentDiamonds;

  /* Header target */
  if (TARGET_NAME){
    document.getElementById('giftTitle').textContent = `গিফট পাঠান → ${TARGET_NAME}`;
    document.getElementById('giftSubtitle').textContent = 'পছন্দের গিফটে টাচ করে পাঠান';
  }
})();

/* ============ FLOATING PARTICLES ============ */
(function(){
  const layer = document.getElementById('particles');
  const emojis = ['🌹','🌸','💐','🌺','🌻','🌷','🤝','💖','✨','🌼','💞','🫶'];
  const count = 22;
  for (let i = 0; i < count; i++){
    const s = document.createElement('span');
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (12 + Math.random() * 20).toFixed(1) + 'px';
    s.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + 's';
    s.style.animationDelay = (-Math.random() * 26).toFixed(1) + 's';
    s.style.opacity = (0.06 + Math.random() * 0.12).toFixed(2);
    layer.appendChild(s);
  }
})();

/* ============ SELECT GIFT ============ */
window.selectGift = function(element, price, emoji, videoGift){
  document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
  element.classList.add('selected');

  selectedPrice = price;
  selectedElement = element;
  selectedEmoji = emoji || '💖';
  isVideoGift = !!videoGift;

  const imgEl = element.querySelector('.gift-img');
  selectedImageUrl = imgEl ? imgEl.src : '';
  selectedGiftName = emoji === '📽️' ? 'Premium Video Gift' : (emoji + ' Gift');

  sendBtn.classList.add('active');
  sendBtn.textContent = `গিফট পাঠান  •  ${price} 💎`;

  if (navigator.vibrate) navigator.vibrate(12);
};

/* ============ TOAST ============ */
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ============ SEND GIFT ============ */
window.sendGift = function(){
  if (selectedPrice === 0) return;

  if (currentDiamonds < selectedPrice){
    showToast('❌ পর্যাপ্ত ডায়মন্ড নেই!');
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    return;
  }

  /* UI-তে ব্যালেন্স কমাই (Owner Room আসল transaction করবে) */
  currentDiamonds -= selectedPrice;
  animateCounter(diamondDisplay, currentDiamonds);

  if (navigator.vibrate) navigator.vibrate(25);

  const giftData = {
    type: 'HOURFM_GIFT',
    name: selectedGiftName,
    emoji: selectedEmoji,
    price: selectedPrice,
    isVideo: isVideoGift,
    video: isVideoGift
      ? 'https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/VID_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%A9_%E0%A7%A6%E0%A7%AD%E0%A7%AB%E0%A7%AB%E0%A7%AB%E0%A7%AB.mp4'
      : null,
    image: selectedImageUrl,
    targetUid: TARGET_UID,
    targetName: TARGET_NAME
  };

  if (IS_EMBEDDED){
    try {
      window.parent.postMessage(giftData, '*');
    } catch(e){
      console.warn('postMessage failed:', e);
    }
    showToast('✅ গিফট পাঠানো হয়েছে');
    resetSelectionUI();
    return;
  }

  showToast('ℹ️ ভয়েস ক্লাব থেকে ব্যবহার করুন');
  resetSelectionUI();
};

function resetSelectionUI(){
  if (selectedElement) selectedElement.classList.remove('selected');
  selectedElement = null;
  selectedPrice = 0;
  isVideoGift = false;
  selectedEmoji = '💖';
  selectedGiftName = 'Gift';
  selectedImageUrl = '';
  sendBtn.classList.remove('active');
  sendBtn.textContent = 'গিফট পাঠান';
}

function animateCounter(el, target){
  const start = parseInt(el.textContent, 10) || 0;
  const diff = target - start;
  const dur = 500;
  const t0 = performance.now();
  function step(now){
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(start + diff * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============ LISTEN TO PARENT (balance sync) ============ */
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'HOURFM_BALANCE') return;
  if (typeof d.balance === 'number'){
    currentDiamonds = d.balance;
    animateCounter(diamondDisplay, currentDiamonds);
  }
});
</script>
