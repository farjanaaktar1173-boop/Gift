<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premium Gift Panel</title>
<style>
:root{
    --bg:#06060e;
    --pink:#ff2a74;
    --violet:#8b5cf6;
    --cyan:#22d3ee;
    --gold:#ffd166;
    --text:#ffffff;
    --muted:rgba(255,255,255,.55);
    --border:rgba(255,255,255,.10);
}
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Roboto,-apple-system,sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}
html,body{height:100%;}
body{
    background:var(--bg);
    color:var(--text);
    height:100vh;
    width:100vw;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* ================= AURORA BG ================= */
body::before{
    content:'';
    position:fixed;
    inset:-60%;
    background:conic-gradient(from 0deg,
        #ff2a74, #8b5cf6, #22d3ee, #ff7e5f, #ff2a74);
    filter:blur(150px);
    opacity:.18;
    animation:auroraSpin 30s linear infinite;
    z-index:-2;
}
@keyframes auroraSpin{ to{ transform:rotate(360deg); } }
body::after{
    content:'';
    position:fixed;
    inset:0;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(255,42,116,.10), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(34,211,238,.10), transparent 60%);
    z-index:-1;
    pointer-events:none;
}

/* ================= FLOATING BG EMOJIS ================= */
#particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}
#particles span{
    position:absolute;
    bottom:-70px;
    animation:floatUp linear infinite;
    will-change:transform;
}
@keyframes floatUp{
    0%  { transform:translateY(0) rotate(0deg) scale(1); }
    100%{ transform:translateY(-120vh) rotate(360deg) scale(1.15); }
}

/* ================= OVERLAY ================= */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(3,3,10,.62);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    opacity:0;
    visibility:hidden;
    transition:opacity .35s ease, visibility .35s ease;
    z-index:99;
}
.overlay.active{ opacity:1; visibility:visible; }

/* ================= BOTTOM SHEET ================= */
.popup-container{
    position:fixed;
    left:50%;
    bottom:0;
    width:min(100vw,560px);
    height:62vh;
    min-height:380px;
    transform:translate(-50%,110%);
    background:linear-gradient(180deg, rgba(26,26,40,.98), rgba(12,12,20,.99));
    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);
    border-radius:32px 32px 0 0;
    border-top:1px solid rgba(255,255,255,.14);
    box-shadow:0 -28px 80px rgba(0,0,0,.80), inset 0 1px 0 rgba(255,255,255,.10);
    transition:transform .55s cubic-bezier(.175,.885,.32,1.275);
    z-index:100;
    display:flex;
    flex-direction:column;
    padding:10px 16px 16px;
    overflow:hidden;
}
.popup-container.active{ transform:translate(-50%,0); }
.popup-container::before{
    content:'';
    position:absolute;
    top:0;left:14%;right:14%;
    height:2px;
    border-radius:99px;
    background:linear-gradient(90deg,transparent,var(--pink),var(--cyan),transparent);
    opacity:.95;
}
.grabber{
    width:48px;height:4px;
    border-radius:99px;
    background:rgba(255,255,255,.20);
    margin:2px auto 12px;
    flex:0 0 auto;
}

/* ================= HEADER ================= */
.popup-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding-bottom:12px;
    border-bottom:1px solid rgba(255,255,255,.07);
    flex:0 0 auto;
}
.header-title{
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:0;
}
.header-title h2{
    font-size:15.5px;
    font-weight:800;
    letter-spacing:.3px;
    background:linear-gradient(135deg,#fff,#ffb3cf);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
}
.header-title p{
    font-size:11px;
    color:var(--muted);
    font-weight:500;
    white-space:nowrap;
}
.diamond-balance{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 15px;
    border-radius:999px;
    font-weight:800;
    font-size:13.5px;
    color:#9beeff;
    background:linear-gradient(135deg, rgba(34,211,238,.16), rgba(34,211,238,.05));
    border:1px solid rgba(34,211,238,.35);
    box-shadow:0 0 20px rgba(34,211,238,.22), inset 0 0 12px rgba(34,211,238,.08);
    white-space:nowrap;
}
.diamond-balance .gem{
    font-size:14px;
    filter:drop-shadow(0 0 6px rgba(34,211,238,.9));
    animation:gemGlow 2.2s ease-in-out infinite;
}
@keyframes gemGlow{
    0%,100%{ transform:scale(1); }
    50%    { transform:scale(1.18); }
}
.close-btn{
    width:32px;height:32px;
    flex:0 0 auto;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:#fff;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
}
.close-btn:active{ transform:scale(.9); background:rgba(255,42,116,.3); }

/* ================= GIFT GRID ================= */
.gift-grid{
    flex:1 1 auto;
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    grid-auto-rows:130px;
    gap:12px;
    padding:16px 4px 16px;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:rgba(255,42,116,.6) transparent;
    align-content:start;
}
.gift-grid::-webkit-scrollbar{ width:4px; }
.gift-grid::-webkit-scrollbar-track{ background:transparent; }
.gift-grid::-webkit-scrollbar-thumb{
    background:linear-gradient(180deg,#ff2a74,#8b5cf6);
    border-radius:99px;
}

/* ================= GIFT CARD ================= */
.gift-card{
    position:relative;
    width:100%;
    height:100%;
    border-radius:22px;
    background:linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
    border:1px solid var(--border);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px 5px;
    cursor:pointer;
    overflow:hidden;
    transition:
        transform .38s cubic-bezier(.175,.885,.32,1.275),
        box-shadow .35s ease,
        border-color .35s ease,
        background .35s ease;
    box-shadow:0 6px 18px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07);
}
.gift-card::after{
    content:'';
    position:absolute;
    top:0;left:-130%;
    width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);
    transform:skewX(-22deg);
    transition:left .7s ease;
    pointer-events:none;
}
.gift-card:active{ transform:scale(.95); }
.gift-card.selected::after{ left:140%; }
.gift-card.selected{
    border-color:rgba(255,42,116,.95);
    background:linear-gradient(160deg, rgba(255,42,116,.26), rgba(139,92,246,.16));
    transform:translateY(-3px) scale(1.02);
    box-shadow:
        0 0 0 1px rgba(255,42,116,.55),
        0 14px 34px rgba(255,42,116,.42),
        inset 0 0 24px rgba(255,42,116,.18);
}

/* ============ PREMIUM VIDEO GIFT ============ */
.gift-card.premium{
    background:
        linear-gradient(160deg, rgba(255,209,102,.15), rgba(255,42,116,.12)),
        linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border:1px solid rgba(255,209,102,.45);
    box-shadow:
        0 6px 22px rgba(255,180,60,.25),
        inset 0 1px 0 rgba(255,255,255,.12);
}
.gift-card.premium::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:22px;
    padding:1px;
    background:linear-gradient(135deg,#ffd166,#ff2a74,#8b5cf6,#ffd166);
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
            mask-composite:exclude;
    opacity:.75;
    pointer-events:none;
    animation:premiumBorder 3s linear infinite;
    background-size:300% 300%;
}
@keyframes premiumBorder{
    0%  { background-position:0% 50%; }
    100%{ background-position:300% 50%; }
}
.gift-card.premium.selected{
    border-color:rgba(255,209,102,.95);
    background:linear-gradient(160deg, rgba(255,209,102,.30), rgba(255,42,116,.22));
    box-shadow:
        0 0 0 1px rgba(255,209,102,.85),
        0 16px 40px rgba(255,180,60,.55),
        inset 0 0 26px rgba(255,209,102,.28);
}
.gift-card.premium .premium-star{
    position:absolute;
    top:7px;left:7px;
    font-size:12px;
    filter:drop-shadow(0 0 5px rgba(255,209,102,.95));
    animation:starTwinkle 1.8s ease-in-out infinite;
    z-index:2;
}
@keyframes starTwinkle{
    0%,100%{ transform:scale(1) rotate(0deg); opacity:1; }
    50%    { transform:scale(1.25) rotate(15deg); opacity:.75; }
}

/* ================= IMAGE WRAPPER ================= */
.image-wrapper{
    position:relative;
    width:58px;height:58px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:radial-gradient(circle at 32% 26%, rgba(255,255,255,.22), rgba(255,255,255,.03) 70%);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 0 16px rgba(255,255,255,.08);
    overflow:hidden;
    transition:transform .38s cubic-bezier(.175,.885,.32,1.275), box-shadow .35s;
    flex:0 0 auto;
}
.gift-card.selected .image-wrapper{
    transform:scale(1.10);
    border-color:rgba(255,42,116,.75);
    box-shadow:0 0 24px rgba(255,42,116,.60), inset 0 0 16px rgba(255,42,116,.28);
}
.gift-img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* ================= EMOJI CIRCLE ================= */
.emoji-circle{
    position:relative;
    width:58px;height:58px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:32px;
    line-height:1;
    overflow:hidden;
    transition:transform .38s cubic-bezier(.175,.885,.32,1.275), box-shadow .4s ease;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35));
    flex:0 0 auto;
}
.emoji-circle span{
    display:block;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    transform:translateY(-1px);
    animation:emojiBreathe 3.4s ease-in-out infinite;
}
@keyframes emojiBreathe{
    0%,100%{ transform:translateY(-1px) scale(1); }
    50%    { transform:translateY(-1px) scale(1.06); }
}
.halo-rose     { background:radial-gradient(circle at 30% 25%, #ffd7e4, #ff7aa2 55%, #c9165a 100%); }
.halo-tulip    { background:radial-gradient(circle at 30% 25%, #ffe1f0, #f78ccc 55%, #a91f74 100%); }
.halo-blossom  { background:radial-gradient(circle at 30% 25%, #ffe7f1, #ffa8c8 55%, #d14788 100%); }
.halo-sunflower{ background:radial-gradient(circle at 30% 25%, #fff2b6, #ffd166 55%, #cc8a00 100%); }
.halo-hibiscus { background:radial-gradient(circle at 30% 25%, #ffd4d4, #ff7373 55%, #c1121f 100%); }
.halo-hand     { background:radial-gradient(circle at 30% 25%, #d9f7ff, #6cd0ff 55%, #0b6fb0 100%); }
.halo-heart    { background:radial-gradient(circle at 30% 25%, #ffd7dd, #ff5c86 55%, #b51133 100%); }
.emoji-circle::after{
    content:'';
    position:absolute;
    inset:-2px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.55), transparent 45%);
    pointer-events:none;
}
.gift-card.selected .emoji-circle{
    transform:scale(1.10);
    box-shadow:
        0 0 24px rgba(255,42,116,.60),
        0 0 42px rgba(255,209,102,.35),
        inset 0 0 16px rgba(255,255,255,.28);
}

/* ================= PRICE PILL ================= */
.gift-price{
    display:flex;
    align-items:center;
    gap:3px;
    font-size:11px;
    font-weight:800;
    color:#8fe9ff;
    padding:3px 9px;
    border-radius:999px;
    background:rgba(34,211,238,.10);
    border:1px solid rgba(34,211,238,.28);
    transition:.3s;
    white-space:nowrap;
}
.gift-card.selected .gift-price{
    color:#fff;
    background:linear-gradient(135deg, rgba(255,42,116,.45), rgba(255,126,95,.35));
    border-color:rgba(255,42,116,.7);
    box-shadow:0 0 14px rgba(255,42,116,.5);
}
.gift-card.premium .gift-price{
    color:#ffe28a;
    background:linear-gradient(135deg, rgba(255,209,102,.20), rgba(255,42,116,.12));
    border-color:rgba(255,209,102,.55);
    box-shadow:0 0 12px rgba(255,209,102,.30);
}
.gift-card.premium.selected .gift-price{
    color:#fff;
    background:linear-gradient(135deg, rgba(255,209,102,.55), rgba(255,42,116,.45));
    border-color:rgba(255,209,102,.85);
    box-shadow:0 0 16px rgba(255,209,102,.65);
}

/* check badge */
.check-badge{
    position:absolute;
    top:6px;right:6px;
    width:19px;height:19px;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:10px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(135deg,#ff2a74,#ff7e5f);
    box-shadow:0 4px 12px rgba(255,42,116,.65);
    transform:scale(0) rotate(-90deg);
    opacity:0;
    transition:transform .4s cubic-bezier(.175,.885,.32,1.5), opacity .3s;
    z-index:2;
}
.gift-card.selected .check-badge{
    transform:scale(1) rotate(0deg);
    opacity:1;
}
.gift-card.premium .check-badge{
    background:linear-gradient(135deg,#ffd166,#ff7e5f);
    box-shadow:0 4px 14px rgba(255,209,102,.75);
}

/* ================= FOOTER ================= */
.popup-footer{
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.07);
    flex:0 0 auto;
}
.send-btn{
    position:relative;
    width:100%;
    padding:15px;
    font-size:15px;
    font-weight:900;
    letter-spacing:.6px;
    color:#fff;
    border:none;
    border-radius:18px;
    cursor:pointer;
    overflow:hidden;
    background:linear-gradient(135deg,#ff2a74,#ff7e5f,#ff2a74);
    background-size:220% 100%;
    box-shadow:0 10px 30px rgba(255,42,116,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transition:opacity .3s ease, filter .3s ease, transform .2s ease, background-position .8s ease;
}
.send-btn:active{ transform:scale(.97); }
.send-btn.active{
    opacity:1;
    pointer-events:auto;
    animation:btnShine 2.6s linear infinite;
}
@keyframes btnShine{
    0%  { background-position:0% 50%; }
    100%{ background-position:220% 50%; }
}
.send-btn:not(.active){
    opacity:.35;
    filter:grayscale(.85);
    pointer-events:none;
}

/* ================= TOAST ================= */
.toast{
    position:fixed;
    top:26px;
    left:50%;
    transform:translate(-50%,-24px);
    padding:12px 22px;
    border-radius:14px;
    font-size:13.5px;
    font-weight:700;
    color:#fff;
    background:linear-gradient(135deg, rgba(255,42,116,.95), rgba(255,126,95,.95));
    box-shadow:0 12px 34px rgba(255,42,116,.5);
    opacity:0;
    visibility:hidden;
    transition:.35s cubic-bezier(.175,.885,.32,1.275);
    z-index:999999;
    white-space:nowrap;
}
.toast.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
}

/* ================= FULLSCREEN VIDEO ================= */
.video-container{
    position:fixed;
    inset:0;
    background:#000;
    z-index:99999;
    pointer-events:none;
    opacity:0;
    visibility:hidden;
    overflow:hidden;
    transition:opacity .4s ease, visibility .4s ease;
}
.video-container.active{ opacity:1; visibility:visible; }
.gift-video{
    position:absolute;
    top:50%;left:50%;
    min-width:100%;
    min-height:100%;
    width:100vw;
    height:100vh;
    object-fit:cover !important;
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    transition:
        transform 2.4s cubic-bezier(.55,.06,.32,1),
        opacity   2.2s cubic-bezier(.55,.06,.32,1);
    will-change:transform, opacity;
}
.gift-video.shrink{
    transform:translate(-50%,-50%) scale(0.05);
    opacity:0;
    filter:blur(6px);
}

/* ============================================================
   🌸  BEAUTIFUL EMOJI GIFT ANIMATION  🌸
   ============================================================ */
.anim-layer{
    position:fixed;
    inset:0;
    z-index:99998;
    pointer-events:none;
    overflow:hidden;
}

/* 1) Soft warm background glow pulse */
.warm-glow{
    position:absolute;
    top:50%;left:50%;
    width:60vmin;height:60vmin;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle,
        rgba(255,209,102,.55) 0%,
        rgba(255,42,116,.35) 35%,
        rgba(139,92,246,.18) 60%,
        transparent 75%);
    filter:blur(40px);
    opacity:0;
    animation:warmGlowPulse 2600ms ease-out forwards;
}
@keyframes warmGlowPulse{
    0%  { transform:translate(-50%,-50%) scale(.2); opacity:0; }
    25% { transform:translate(-50%,-50%) scale(1.1); opacity:.95; }
    70% { transform:translate(-50%,-50%) scale(1.6); opacity:.6; }
    100%{ transform:translate(-50%,-50%) scale(2.2); opacity:0; }
}

/* 2) Expanding shockwave rings */
.shockwave{
    position:absolute;
    top:50%;left:50%;
    width:70px;height:70px;
    border-radius:50%;
    border:3px solid rgba(255,209,102,.85);
    box-shadow:
        0 0 20px rgba(255,209,102,.9),
        0 0 40px rgba(255,42,116,.6),
        inset 0 0 20px rgba(255,209,102,.5);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    animation:ringExpand 1500ms cubic-bezier(.2,.8,.2,1) forwards;
}
.shockwave.pink{
    border-color:rgba(255,42,116,.85);
    box-shadow:
        0 0 20px rgba(255,42,116,.9),
        0 0 40px rgba(139,92,246,.6),
        inset 0 0 20px rgba(255,42,116,.5);
}
.shockwave.cyan{
    border-color:rgba(34,211,238,.85);
    box-shadow:
        0 0 20px rgba(34,211,238,.9),
        0 0 40px rgba(139,92,246,.55),
        inset 0 0 20px rgba(34,211,238,.5);
}
@keyframes ringExpand{
    0%  { transform:translate(-50%,-50%) scale(0);   opacity:0; }
    15% { opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(6.5); opacity:0; }
}

/* 3) Main big emoji */
.fly-emoji{
    position:absolute;
    top:50%;left:50%;
    font-size:130px;
    line-height:1;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    will-change:transform, opacity, filter;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    filter:
        drop-shadow(0 0 26px rgba(255,209,102,.95))
        drop-shadow(0 0 55px rgba(255,42,116,.65))
        drop-shadow(0 0 90px rgba(139,92,246,.45));
    z-index:5;
}

/* 4) Burst sparkles */
.burst-spark{
    position:absolute;
    top:50%;left:50%;
    width:10px;height:10px;
    border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    will-change:transform, opacity;
    z-index:4;
}

/* 5) Small satellite emojis */
.satellite{
    position:absolute;
    top:50%;left:50%;
    font-size:34px;
    line-height:1;
    transform:translate(-50%,-50%) scale(0) rotate(0deg);
    opacity:0;
    will-change:transform, opacity;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    filter:drop-shadow(0 0 12px rgba(255,209,102,.85));
    z-index:4;
}

/* 6) Falling petals from top */
.petal{
    position:absolute;
    top:-60px;
    font-size:32px;
    line-height:1;
    opacity:0;
    will-change:transform, opacity;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.35));
    z-index:3;
}

/* responsive */
@media (max-height:640px){
    .popup-container{ height:68vh; }
}
@media (max-width:360px){
    .gift-grid{ grid-auto-rows:120px; }
    .image-wrapper, .emoji-circle{ width:52px; height:52px; }
    .emoji-circle{ font-size:28px; }
    .fly-emoji{ font-size:110px; }
}
</style>
</head>
<body>

<div id="particles"></div>

<div class="overlay" id="overlay" onclick="closePopup()"></div>

<!-- ================= BOTTOM SHEET ================= -->
<div class="popup-container" id="popup">
    <div class="grabber"></div>

    <div class="popup-header">
        <div class="header-title">
            <h2>গিফট পাঠান 🌹</h2>
            <p>পছন্দের গিফটে টাচ করুন</p>
        </div>
        <div class="diamond-balance">
            <span class="gem">💎</span>
            <span id="diamondCount">1000</span>
        </div>
        <button class="close-btn" onclick="closePopup()">✕</button>
    </div>

    <div class="gift-grid" id="giftGrid">

        <!-- ⭐ PREMIUM VIDEO GIFT ⭐ -->
        <div class="gift-card premium" onclick="selectGift(this,100,'📽️',true)">
            <span class="premium-star">⭐</span>
            <span class="check-badge">✓</span>
            <div class="image-wrapper">
                <img class="gift-img"
                     src="https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/1ec9b0e3ccf773b2467a804456f096385a2798d1/1791000761663.jpg"
                     alt="Premium Gift">
            </div>
            <div class="gift-price">💎 100</div>
        </div>

        <!-- 🌹 flowers -->
        <div class="gift-card" onclick="selectGift(this,5,'🌹')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-rose"><span>🌹</span></div>
            <div class="gift-price">💎 5</div>
        </div>

        <div class="gift-card" onclick="selectGift(this,5,'🌷')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-tulip"><span>🌷</span></div>
            <div class="gift-price">💎 5</div>
        </div>

        <div class="gift-card" onclick="selectGift(this,10,'🌸')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-blossom"><span>🌸</span></div>
            <div class="gift-price">💎 10</div>
        </div>

        <div class="gift-card" onclick="selectGift(this,10,'🌻')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-sunflower"><span>🌻</span></div>
            <div class="gift-price">💎 10</div>
        </div>

        <div class="gift-card" onclick="selectGift(this,10,'🌺')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-hibiscus"><span>🌺</span></div>
            <div class="gift-price">💎 10</div>
        </div>

        <!-- 🤝 friendship -->
        <div class="gift-card" onclick="selectGift(this,15,'🤝')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-hand"><span>🤝</span></div>
            <div class="gift-price">💎 15</div>
        </div>

        <div class="gift-card" onclick="selectGift(this,15,'💖')">
            <span class="check-badge">✓</span>
            <div class="emoji-circle halo-heart"><span>💖</span></div>
            <div class="gift-price">💎 15</div>
        </div>

    </div>

    <div class="popup-footer">
        <button class="send-btn" id="sendBtn" onclick="sendGift()">গিফট পাঠান</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<!-- ================= FULLSCREEN VIDEO ================= -->
<div class="video-container" id="videoContainer">
    <video id="giftVideo" class="gift-video" playsinline webkit-playsinline preload="auto">
        <source src="https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/VID_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%A9_%E0%A7%A6%E0%A7%AD%E0%A7%AB%E0%A7%AB%E0%A7%AB%E0%A7%AB.mp4" type="video/mp4">
    </video>
</div>

<script>
/* ================= STATE ================= */
let currentDiamonds = 1000;
let selectedPrice   = 0;
let selectedElement = null;
let isVideoGift     = false;
let selectedEmoji   = '💖';

const overlay        = document.getElementById('overlay');
const popup          = document.getElementById('popup');
const sendBtn        = document.getElementById('sendBtn');
const diamondDisplay = document.getElementById('diamondCount');
const videoContainer = document.getElementById('videoContainer');
const giftVideo      = document.getElementById('giftVideo');
const toastEl        = document.getElementById('toast');

/* ================= FLOATING BG EMOJIS ================= */
(function initParticles(){
    const layer  = document.getElementById('particles');
    const emojis = ['🌹','🌸','💐','🌺','🌻','🌷','🤝','💖','✨','🌼','💞','🫶'];
    const count  = 22;
    for (let i = 0; i < count; i++){
        const s = document.createElement('span');
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = (Math.random() * 100) + '%';
        s.style.fontSize = (12 + Math.random() * 20).toFixed(1) + 'px';
        s.style.animationDuration = (14 + Math.random() * 16).toFixed(1) + 's';
        s.style.animationDelay = (-Math.random() * 26).toFixed(1) + 's';
        s.style.opacity = (0.06 + Math.random() * 0.12).toFixed(2);
        layer.appendChild(s);
    }
})();

/* ================= AUTO OPEN ON LOAD ================= */
window.addEventListener('load', () => {
    setTimeout(openPopup, 300);
});

/* ================= POPUP CONTROLS ================= */
function openPopup(){
    overlay.classList.add('active');
    popup.classList.add('active');
}
function closePopup(){
    overlay.classList.remove('active');
    popup.classList.remove('active');
}

/* ================= SELECT GIFT ================= */
function selectGift(element, price, emoji, videoGift){
    document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
    element.classList.add('selected');

    selectedPrice   = price;
    selectedElement = element;
    selectedEmoji   = emoji || '💖';
    isVideoGift     = !!videoGift;

    sendBtn.classList.add('active');
    sendBtn.textContent = `গিফট পাঠান  •  ${price} 💎`;

    if (navigator.vibrate) navigator.vibrate(12);
}

/* ================= TOAST ================= */
let toastTimer = null;
function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ================= SEND GIFT ================= */
function sendGift(){
    if (selectedPrice === 0) return;

    if (currentDiamonds < selectedPrice){
        showToast('❌ পর্যাপ্ত ডায়মন্ড নেই!');
        if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
        return;
    }

    currentDiamonds -= selectedPrice;
    animateCounter(diamondDisplay, currentDiamonds);

    if (navigator.vibrate) navigator.vibrate(25);

    closePopup();

    const emojiToSend = selectedEmoji;
    const wasVideo    = isVideoGift;

    // reset selection FIRST (so UI is clean while animation plays)
    resetSelectionUI();

    if (wasVideo){
        setTimeout(playVideoAnimation, 300);
    } else {
        setTimeout(() => {
            playEmojiAnimation(emojiToSend, () => {
                // when animation finishes → auto reopen popup
                openPopup();
            });
        }, 280);
    }
}

/* reset the popup UI (but not the whole state) */
function resetSelectionUI(){
    if (selectedElement) selectedElement.classList.remove('selected');
    selectedElement = null;
    selectedPrice   = 0;
    isVideoGift     = false;
    sendBtn.classList.remove('active');
    sendBtn.textContent = 'গিফট পাঠান';
}

/* animated counter */
function animateCounter(el, target){
    const start = parseInt(el.textContent, 10) || 0;
    const diff  = target - start;
    const dur   = 500;
    const t0    = performance.now();
    function step(now){
        const p = Math.min((now - t0) / dur, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(start + diff * eased);
        if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

/* ============================================================
   🌸  BEAUTIFUL EMOJI GIFT ANIMATION  🌸
   ============================================================ */
function playEmojiAnimation(emoji, onDone){
    const layer = document.createElement('div');
    layer.className = 'anim-layer';
    document.body.appendChild(layer);

    const TOTAL = 3000;   // total animation time (ms)

    /* ---------- 1) WARM GLOW ---------- */
    const glow = document.createElement('div');
    glow.className = 'warm-glow';
    layer.appendChild(glow);

    /* ---------- 2) SHOCKWAVE RINGS (3 colours) ---------- */
    const ringColours = ['', 'pink', 'cyan'];
    ringColours.forEach((cls, i) => {
        const ring = document.createElement('div');
        ring.className = 'shockwave ' + cls;
        ring.style.animationDelay = (i * 200) + 'ms';
        layer.appendChild(ring);
    });

    /* ---------- 3) BURST SPARKLES (radial) ---------- */
    const sparkColours = ['#ffd166','#ff7e5f','#ff2a74','#8b5cf6','#22d3ee','#ffffff'];
    for (let i = 0; i < 26; i++){
        const spark = document.createElement('div');
        spark.className = 'burst-spark';

        const angle = (Math.PI * 2 * i) / 26 + (Math.random() - .5) * 0.35;
        const dist  = 130 + Math.random() * 190;
        const tx    = Math.cos(angle) * dist;
        const ty    = Math.sin(angle) * dist;
        const col   = sparkColours[i % sparkColours.length];
        const size  = 6 + Math.random() * 8;

        spark.style.width  = size + 'px';
        spark.style.height = size + 'px';
        spark.style.background = col;
        spark.style.boxShadow =
            `0 0 10px ${col}, 0 0 22px ${col}, 0 0 40px ${col}`;

        layer.appendChild(spark);

        spark.animate([
            { transform: 'translate(-50%,-50%) scale(0)', opacity: 0 },
            { transform: `translate(-50%,-50%) translate(${tx*0.15}px, ${ty*0.15}px) scale(1.4)`, opacity: 1, offset: .18 },
            { transform: `translate(-50%,-50%) translate(${tx*0.75}px, ${ty*0.75}px) scale(1)`, opacity: 1, offset: .55 },
            { transform: `translate(-50%,-50%) translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
        ], {
            duration: 1600 + Math.random() * 400,
            delay: 100 + Math.random() * 200,
            easing: 'cubic-bezier(.2,.8,.2,1)',
            fill: 'forwards'
        });
    }

    /* ---------- 4) SATELLITE SMALL EMOJIS ---------- */
    const satelliteCount = 8;
    for (let i = 0; i < satelliteCount; i++){
        const sat = document.createElement('div');
        sat.className = 'satellite';
        sat.textContent = emoji;

        const angle = (Math.PI * 2 * i) / satelliteCount + Math.random() * 0.3;
        const dist  = 120 + Math.random() * 130;
        const tx    = Math.cos(angle) * dist;
        const ty    = Math.sin(angle) * dist;

        layer.appendChild(sat);

        sat.animate([
            { transform: 'translate(-50%,-50%) scale(0) rotate(0deg)', opacity: 0 },
            { transform: `translate(-50%,-50%) translate(${tx*0.4}px, ${ty*0.4}px) scale(1.2) rotate(120deg)`, opacity: 1, offset: .25 },
            { transform: `translate(-50%,-50%) translate(${tx}px, ${ty}px) scale(0.9) rotate(300deg)`, opacity: 1, offset: .65 },
            { transform: `translate(-50%,-50%) translate(${tx*1.2}px, ${ty*1.2}px) scale(0) rotate(420deg)`, opacity: 0 }
        ], {
            duration: 1900 + Math.random() * 500,
            delay: 200 + i * 70,
            easing: 'cubic-bezier(.2,.7,.3,1)',
            fill: 'forwards'
        });
    }

    /* ---------- 5) FALLING PETALS FROM TOP ---------- */
    const petalPool = ['🌸','🌺','🌷','🌹','🌻','💮','🏵️','✨','💫'];
    for (let i = 0; i < 24; i++){
        const p = document.createElement('div');
        p.className = 'petal';
        p.textContent = petalPool[Math.floor(Math.random() * petalPool.length)];
        p.style.left = (Math.random() * 100) + '%';
        p.style.fontSize = (18 + Math.random() * 26) + 'px';
        layer.appendChild(p);

        const drift = (Math.random() - 0.5) * 160;
        const rotateEnd = 260 + Math.random() * 360;
        const dur = 2200 + Math.random() * 1200;

        p.animate([
            { transform: 'translate(0, 0) rotate(0deg) scale(.4)', opacity: 0 },
            { transform: `translate(${drift*0.3}px, 25vh) rotate(${rotateEnd*0.35}deg) scale(1)`, opacity: .95, offset: .25 },
            { transform: `translate(${drift*0.7}px, 60vh) rotate(${rotateEnd*0.7}deg) scale(1)`, opacity: .9, offset: .6 },
            { transform: `translate(${drift}px, 110vh) rotate(${rotateEnd}deg) scale(.85)`, opacity: 0 }
        ], {
            duration: dur,
            delay: Math.random() * 700,
            easing: 'cubic-bezier(.35,.1,.5,1)',
            fill: 'forwards'
        });
    }

    /* ---------- 6) MAIN BIG EMOJI ---------- */
    const big = document.createElement('div');
    big.className = 'fly-emoji';
    big.textContent = emoji;
    layer.appendChild(big);

    big.animate([
        { transform: 'translate(-50%,-50%) scale(0) rotate(-180deg)', opacity: 0 },
        { transform: 'translate(-50%,-50%) scale(1.7) rotate(15deg)',  opacity: 1, offset: .14 },
        { transform: 'translate(-50%,-50%) scale(1.2) rotate(-8deg)',  offset: .26 },
        { transform: 'translate(-50%,-50%) scale(1.45) rotate(0deg)',  offset: .40 },
        { transform: 'translate(-50%,-50%) scale(1.35) rotate(4deg)',  offset: .60 },
        { transform: 'translate(-50%,-180vh) scale(.15) rotate(35deg)', opacity: 0 }
    ], {
        duration: TOTAL,
        easing: 'cubic-bezier(.35,0,.2,1)',
        fill: 'forwards'
    });

    /* ---------- CLEANUP + CALLBACK ---------- */
    setTimeout(() => {
        layer.remove();
        if (typeof onDone === 'function') onDone();
    }, TOTAL + 150);
}

/* ================= FULLSCREEN VIDEO (premium gift) ================= */
let shrinkTimer = null;

function playVideoAnimation(){
    clearTimeout(shrinkTimer);
    giftVideo.classList.remove('shrink');

    videoContainer.classList.add('active');
    giftVideo.currentTime = 0;
    giftVideo.volume = 1.0;

    giftVideo.load();

    const playPromise = giftVideo.play();
    if (playPromise !== undefined){
        playPromise.catch(err => console.log('Video playback failed:', err));
    }

    giftVideo.onloadedmetadata = () => {
        const dur = giftVideo.duration || 0;
        const shrinkDelay = Math.max((dur - 2.4) * 1000, 800);
        clearTimeout(shrinkTimer);
        shrinkTimer = setTimeout(() => {
            giftVideo.classList.add('shrink');
        }, shrinkDelay);
    };

    giftVideo.onended = () => {
        clearTimeout(shrinkTimer);
        videoContainer.classList.remove('active');
        giftVideo.classList.remove('shrink');

        // auto reopen popup for next gift
        setTimeout(openPopup, 220);
    };
}
</script>
</body>
</html>
