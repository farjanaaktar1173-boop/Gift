<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Premium Gift Panel • HOUR FM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins','Segoe UI',sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
:root { --gold:#F5D76E; --cyan:#00d2ff; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
body { color:#fff; display:flex; flex-direction:column; position:relative; }

body::before {
    content:''; position:fixed; inset:-20%;
    background:
        radial-gradient(circle at 15% 80%, rgba(168,85,247,.3), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(255,42,116,.25), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(245,215,110,.08), transparent 60%);
    z-index:-2; pointer-events:none;
    animation: auroraShift 12s ease-in-out infinite alternate;
}
@keyframes auroraShift {
    0% { transform: translate(0,0) rotate(0deg) scale(1); }
    100% { transform: translate(-4%,-4%) rotate(8deg) scale(1.15); }
}

/* Balance + Target Row */
.top-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 6px 10px 6px; gap: 8px; flex-shrink: 0;
}
.balance-chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: linear-gradient(135deg, rgba(0,210,255,.18), rgba(0,210,255,.06));
    padding: 7px 14px 7px 8px; border-radius: 22px;
    border: 1px solid rgba(0,210,255,.4);
    box-shadow: 0 0 16px rgba(0,210,255,.15);
}
.diamond-icon {
    width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg,#00d2ff,#0098d4); border-radius: 50%;
    font-size: 12px; box-shadow: 0 0 8px rgba(0,210,255,.6);
}
#diamondCount { font-size: 14px; font-weight: 800; color: #fff; }
.balance-chip small { font-size: 9px; color: #7dd3fc; }

.target-chip {
    display: none; align-items: center; gap: 6px;
    background: rgba(245,215,110,.12);
    padding: 7px 12px; border-radius: 20px;
    border: 1px solid rgba(245,215,110,.4);
    font-size: 11px; font-weight: 600; color: var(--gold);
    max-width: 55%; overflow: hidden;
}
.target-chip.visible { display: inline-flex; }
.target-chip i { font-size: 10px; }
.target-chip span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100px;
}

/* Gift grid */
.gift-grid {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 4px 2px 8px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; align-content: start;
    scrollbar-width: thin; scrollbar-color: rgba(245,215,110,.4) transparent;
}
.gift-grid::-webkit-scrollbar { width: 3px; }
.gift-grid::-webkit-scrollbar-thumb { background: rgba(245,215,110,.4); border-radius: 4px; }

.gift-card {
    aspect-ratio: 1 / 1.15;
    background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border-radius: 16px; padding: 8px 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1.5px solid rgba(255,255,255,.08);
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.9,.3,1.2);
    position: relative; overflow: hidden;
}
.gift-card:active { transform: scale(.94); }
.gift-card.selected {
    border-color: var(--gold);
    background: linear-gradient(145deg, rgba(245,215,110,.15), rgba(212,175,55,.08));
    box-shadow: 0 0 0 1px rgba(245,215,110,.4) inset, 0 0 24px rgba(245,215,110,.5);
    transform: translateY(-3px) scale(1.02);
}
.gift-img-wrap {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), rgba(0,0,0,.2));
    margin-bottom: 6px; border: 1.5px solid rgba(255,255,255,.1);
    overflow: hidden; flex-shrink: 0;
    transition: all .25s;
}
.gift-card.selected .gift-img-wrap {
    border-color: var(--gold);
    box-shadow: 0 0 16px rgba(245,215,110,.6);
    transform: scale(1.08);
}
.gift-img-wrap img { width:100%; height:100%; object-fit: cover; }
.gift-img-wrap .emoji-fallback { font-size: 30px; filter: drop-shadow(0 2px 6px rgba(0,0,0,.5)); }
.gift-name {
    font-size: 10px; color: #ccc; font-weight: 500; margin-bottom: 3px;
    text-align: center; max-width: 100%; padding: 0 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.gift-price {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; color: var(--cyan); font-weight: 700;
    text-shadow: 0 0 6px rgba(0,210,255,.4);
}
.gift-price::before { content: '💎'; font-size: 9px; }

/* Footer */
.footer { padding: 10px 6px 4px; border-top: 1px solid rgba(255,255,255,.07); flex-shrink: 0; }
.selected-info {
    text-align: center; font-size: 11px; color: #9c8fb0; font-weight: 500;
    min-height: 16px; margin-bottom: 8px; transition: color .2s;
}
.selected-info.has-selection { color: var(--gold); font-weight: 600; }

.send-btn {
    width: 100%; padding: 14px;
    border: none; border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #a855f7, #ff2a74);
    background-size: 200% 200%;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .3s;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 20px rgba(168,85,247,.4);
    font-family: inherit;
}
.send-btn:disabled {
    opacity: .35; cursor: not-allowed; box-shadow: none;
    background: rgba(255,255,255,.08);
}
.send-btn:not(:disabled) { animation: gradientMove 3s ease infinite; }
@keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
.send-btn:not(:disabled):active { transform: scale(.97); }
</style>
</head>
<body>

    <div class="top-row">
        <div class="balance-chip">
            <div class="diamond-icon">💎</div>
            <span id="diamondCount">1000</span>
            <small>ডায়মন্ড</small>
        </div>
        <div class="target-chip" id="targetChip">
            <i class="fa-solid fa-paper-plane"></i>
            <span>To:</span>
            <strong id="targetName">—</strong>
        </div>
    </div>

    <div class="gift-grid" id="giftGrid"></div>

    <div class="footer">
        <div class="selected-info" id="selectedInfo">কোনো গিফট নির্বাচন করুন</div>
        <button class="send-btn" id="sendBtn" onclick="sendGift()" disabled>Send Gift</button>
    </div>

<script>
/* ============ URL PARAMS ============ */
const params = new URLSearchParams(location.search);
const targetUid  = params.get('targetUid') || '';
const targetName = params.get('targetName') || '';
let currentDiamonds = parseInt(params.get('balance')) || 1000;

/* ============ GIFTS DATA ============ */
const GIFTS = [
    {
        id: 'box', name: 'Gift Box', price: 100, emoji: '🎁',
        image: 'https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/1ec9b0e3ccf773b2467a804456f096385a2798d1/1791000761663.jpg',
        video: 'https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/VID_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%A9_%E0%A7%A6%E0%A7%AD%E0%A7%AB%E0%A7%AB%E0%A7%AB%E0%A7%AB.mp4'
    },
    { id:'rose',    name:'Rose',    price:10,   emoji:'🌹', image:'', video:'' },
    { id:'heart',   name:'Heart',   price:50,   emoji:'❤️', image:'', video:'' },
    { id:'diamond', name:'Diamond', price:500,  emoji:'💎', image:'', video:'' },
    { id:'crown',   name:'Crown',   price:1000, emoji:'👑', image:'', video:'' },
    { id:'rocket',  name:'Rocket',  price:2000, emoji:'🚀', image:'', video:'' }
];

/* ============ STATE ============ */
let selectedGift = null;
const $giftGrid = document.getElementById('giftGrid');
const $diamondCount = document.getElementById('diamondCount');
const $sendBtn = document.getElementById('sendBtn');
const $selectedInfo = document.getElementById('selectedInfo');
const $targetChip = document.getElementById('targetChip');

/* ============ INIT ============ */
$diamondCount.textContent = currentDiamonds;
if (targetName) {
    document.getElementById('targetName').textContent = targetName;
    $targetChip.classList.add('visible');
}

/* ============ RENDER ============ */
function renderGifts() {
    $giftGrid.innerHTML = GIFTS.map(g => {
        const imgHTML = g.image
            ? `<img src="${g.image}" alt="${g.name}">`
            : `<span class="emoji-fallback">${g.emoji}</span>`;
        return `
            <div class="gift-card" data-id="${g.id}" onclick="selectGift('${g.id}')">
                <div class="gift-img-wrap">${imgHTML}</div>
                <div class="gift-name">${g.name}</div>
                <div class="gift-price">${g.price}</div>
            </div>`;
    }).join('');
}

/* ============ SELECT ============ */
window.selectGift = function(id) {
    const gift = GIFTS.find(g => g.id === id);
    if (!gift) return;
    document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
    document.querySelector(`.gift-card[data-id="${id}"]`)?.classList.add('selected');
    selectedGift = gift;
    $selectedInfo.textContent = `নির্বাচিত: ${gift.name} — 💎 ${gift.price}`;
    $selectedInfo.classList.add('has-selection');
    $sendBtn.disabled = false;
    if (navigator.vibrate) navigator.vibrate(15);
};

/* ============ SEND ============ */
window.sendGift = function() {
    if (!selectedGift) return;

    if (currentDiamonds < selectedGift.price) {
        $selectedInfo.textContent = '❌ পর্যাপ্ত ডায়মন্ড নেই!';
        $selectedInfo.style.color = '#ff4d6d';
        setTimeout(() => {
            $selectedInfo.style.color = '';
            $selectedInfo.textContent = `নির্বাচিত: ${selectedGift.name} — 💎 ${selectedGift.price}`;
        }, 1800);
        return;
    }

    currentDiamonds -= selectedGift.price;
    $diamondCount.textContent = currentDiamonds;

    const payload = {
        type: 'HOURFM_GIFT',
        giftId: selectedGift.id,
        name: selectedGift.name,
        price: selectedGift.price,
        emoji: selectedGift.emoji,
        image: selectedGift.image,
        video: selectedGift.video,
        targetUid: targetUid,
        targetName: targetName,
        newBalance: currentDiamonds,
        ts: Date.now()
    };

    if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(payload, '*'); } catch(e) { console.warn(e); }
    }

    document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
    $selectedInfo.textContent = '✅ পাঠানো হয়েছে!';
    $selectedInfo.classList.remove('has-selection');
    $sendBtn.disabled = true;
    selectedGift = null;
    if (navigator.vibrate) navigator.vibrate(30);
};

renderGifts();
</script>
</body>
</html>
