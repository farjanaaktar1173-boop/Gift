<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gift Panel • HOUR FM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins','Segoe UI',sans-serif; user-select:none; -webkit-tap-highlight-color:transparent; }
:root { --gold:#F5D76E; --cyan:#00d2ff; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
body { color:#fff; display:flex; flex-direction:column; position:relative; }

body::before {
    content:''; position:fixed; inset:-20%;
    background:
        radial-gradient(circle at 15% 80%, rgba(168,85,247,.3), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(255,42,116,.25), transparent 45%);
    z-index:-1; pointer-events:none;
}

.top-row { display:flex; align-items:center; justify-content:space-between; padding:12px 6px 10px 6px; gap:8px; flex-shrink:0; }
.balance-chip {
    display:inline-flex; align-items:center; gap:7px;
    background: linear-gradient(135deg, rgba(0,210,255,.18), rgba(0,210,255,.06));
    padding:7px 14px 7px 8px; border-radius:22px;
    border:1px solid rgba(0,210,255,.4);
}
.diamond-icon {
    width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#00d2ff,#0098d4); border-radius:50%; font-size:12px;
}
#diamondCount { font-size:14px; font-weight:800; }
.balance-chip small { font-size:9px; color:#7dd3fc; }
.target-chip {
    display:none; align-items:center; gap:6px;
    background:rgba(245,215,110,.12); padding:7px 12px; border-radius:20px;
    border:1px solid rgba(245,215,110,.4);
    font-size:11px; font-weight:600; color:var(--gold);
    max-width:55%; overflow:hidden;
}
.target-chip.visible { display:inline-flex; }
.target-chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100px; }

.gift-grid {
    flex:1; overflow-y:auto; padding:4px 2px 8px;
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:10px; align-content:start;
}
.gift-grid::-webkit-scrollbar { width:3px; }
.gift-grid::-webkit-scrollbar-thumb { background:rgba(245,215,110,.4); border-radius:4px; }

.gift-card {
    aspect-ratio:1/1.15;
    background:linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border-radius:16px; padding:8px 4px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1.5px solid rgba(255,255,255,.08);
    cursor:pointer; transition:all .25s;
}
.gift-card:active { transform:scale(.94); }
.gift-card.selected {
    border-color:var(--gold);
    background:linear-gradient(145deg, rgba(245,215,110,.15), rgba(212,175,55,.08));
    box-shadow:0 0 0 1px rgba(245,215,110,.4) inset, 0 0 24px rgba(245,215,110,.5);
    transform:translateY(-3px) scale(1.02);
}
.gift-img-wrap {
    width:56px; height:56px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.15), rgba(0,0,0,.2));
    margin-bottom:6px; border:1.5px solid rgba(255,255,255,.1);
    overflow:hidden;
}
.gift-img-wrap img { width:100%; height:100%; object-fit:cover; }
.gift-img-wrap .emoji-fallback { font-size:30px; }
.gift-card.selected .gift-img-wrap {
    border-color:var(--gold); box-shadow:0 0 16px rgba(245,215,110,.6);
}
.gift-name {
    font-size:10px; color:#ccc; font-weight:500; margin-bottom:3px;
    text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;
}
.gift-price {
    display:inline-flex; align-items:center; gap:3px;
    font-size:11px; color:var(--cyan); font-weight:700;
}
.gift-price::before { content:'💎'; font-size:9px; }

.footer { padding:10px 6px 4px; border-top:1px solid rgba(255,255,255,.07); flex-shrink:0; }
.selected-info {
    text-align:center; font-size:11px; color:#9c8fb0; font-weight:500;
    min-height:16px; margin-bottom:8px;
}
.selected-info.has-selection { color:var(--gold); font-weight:600; }
.send-btn {
    width:100%; padding:14px; border:none; border-radius:16px;
    background:linear-gradient(135deg, #6366f1, #a855f7, #ff2a74);
    background-size:200% 200%; color:#fff;
    font-size:15px; font-weight:700; cursor:pointer;
    font-family:inherit; transition:all .3s;
    box-shadow:0 4px 20px rgba(168,85,247,.4);
}
.send-btn:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; background:rgba(255,255,255,.08); }
.send-btn:not(:disabled) { animation:gradientMove 3s ease infinite; }
@keyframes gradientMove { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }

.loading { text-align:center; padding:40px 20px; color:#7a6a8f; font-size:12px; }
</style>
</head>
<body>

<div class="top-row">
    <div class="balance-chip">
        <div class="diamond-icon">💎</div>
        <span id="diamondCount">0</span>
        <small>ডায়মন্ড</small>
    </div>
    <div class="target-chip" id="targetChip">
        <i class="fa-solid fa-paper-plane"></i>
        <span>To:</span>
        <strong id="targetName">—</strong>
    </div>
</div>

<div class="gift-grid" id="giftGrid">
    <div class="loading">লোড হচ্ছে...</div>
</div>

<div class="footer">
    <div class="selected-info" id="selectedInfo">কোনো গিফট নির্বাচন করুন</div>
    <button class="send-btn" id="sendBtn" onclick="sendGift()" disabled>Send Gift</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCTn3QEYtRMxm7Y91RSFSvbRJSRHcXMEdI",
    authDomain: "room-7fbf7.firebaseapp.com",
    databaseURL: "https://room-7fbf7-default-rtdb.firebaseio.com",
    projectId: "room-7fbf7",
    storageBucket: "room-7fbf7.firebasestorage.app",
    messagingSenderId: "417946695868",
    appId: "1:417946695868:web:34c6f63269aaf659b2b8b9"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ========== URL PARAMS ========== */
const p = new URLSearchParams(location.search);
const roomId   = p.get('room') || 'demo';
const fromUid  = p.get('uid') || 'anon';
const fromName = p.get('name') || 'User';
const targetUid  = p.get('targetUid') || '';
const targetName = p.get('targetName') || '';
let currentDiamonds = parseInt(p.get('balance')) || 1000;

document.getElementById('diamondCount').textContent = currentDiamonds.toLocaleString();
if (targetName) {
    document.getElementById('targetName').textContent = targetName;
    document.getElementById('targetChip').classList.add('visible');
}

/* ========== DEFAULT GIFTS (ক্যাটালগ খালি থাকলে) ========== */
const DEFAULT_GIFTS = [
    { id:'box', name:'Gift Box', price:100, emoji:'🎁',
      image:'https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/1ec9b0e3ccf773b2467a804456f096385a2798d1/1791000761663.jpg',
      video:'https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/VID_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%A9_%E0%A7%A6%E0%A7%AD%E0%A7%AB%E0%A7%AB%E0%A7%AB%E0%A7%AB.mp4' },
    { id:'rose',    name:'Rose',    price:10,   emoji:'🌹', image:'', video:'' },
    { id:'heart',   name:'Heart',   price:50,   emoji:'❤️', image:'', video:'' },
    { id:'diamond', name:'Diamond', price:500,  emoji:'💎', image:'', video:'' },
    { id:'crown',   name:'Crown',   price:1000, emoji:'👑', image:'', video:'' },
    { id:'rocket',  name:'Rocket',  price:2000, emoji:'🚀', image:'', video:'' }
];

let GIFTS = [];
let selectedGift = null;

/* ========== LOAD CATALOG FROM FIREBASE ========== */
const catalogRef = ref(db, 'giftsCatalog');
onValue(catalogRef, async (snap) => {
    const data = snap.val();
    if (!data || Object.keys(data).length === 0) {
        // ক্যাটালগ খালি — ডিফল্ট সিড করি
        const obj = {};
        DEFAULT_GIFTS.forEach(g => obj[g.id] = g);
        try { await set(catalogRef, obj); } catch(e) { console.warn(e); }
        GIFTS = DEFAULT_GIFTS;
    } else {
        GIFTS = Object.values(data);
    }
    renderGifts();
});

function renderGifts() {
    const grid = document.getElementById('giftGrid');
    if (!GIFTS.length) { grid.innerHTML = '<div class="loading">কোনো গিফট নেই</div>'; return; }
    grid.innerHTML = GIFTS.map(g => {
        const imgHTML = g.image
            ? `<img src="${g.image}" alt="${g.name}">`
            : `<span class="emoji-fallback">${g.emoji||'🎁'}</span>`;
        return `
            <div class="gift-card" data-id="${g.id}" onclick="selectGift('${g.id}')">
                <div class="gift-img-wrap">${imgHTML}</div>
                <div class="gift-name">${g.name}</div>
                <div class="gift-price">${g.price}</div>
            </div>`;
    }).join('');
}

window.selectGift = (id) => {
    const gift = GIFTS.find(g => g.id === id);
    if (!gift) return;
    document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
    document.querySelector(`.gift-card[data-id="${id}"]`)?.classList.add('selected');
    selectedGift = gift;
    const info = document.getElementById('selectedInfo');
    info.textContent = `নির্বাচিত: ${gift.name} — 💎 ${gift.price}`;
    info.classList.add('has-selection');
    document.getElementById('sendBtn').disabled = false;
    if (navigator.vibrate) navigator.vibrate(15);
};

/* ========== SEND GIFT → Firebase + Parent animation ========== */
window.sendGift = async () => {
    if (!selectedGift) return;

    if (currentDiamonds < selectedGift.price) {
        const info = document.getElementById('selectedInfo');
        info.textContent = '❌ পর্যাপ্ত ডায়মন্ড নেই!';
        info.style.color = '#ff4d6d';
        setTimeout(() => {
            info.style.color = '';
            info.textContent = `নির্বাচিত: ${selectedGift.name} — 💎 ${selectedGift.price}`;
        }, 1800);
        return;
    }

    const gift = selectedGift;
    const payload = {
        giftId: gift.id,
        name: gift.name,
        price: gift.price,
        emoji: gift.emoji || '🎁',
        image: gift.image || '',
        video: gift.video || '',
        fromUid, fromName,
        toUid: targetUid,
        toName: targetName,
        ts: Date.now()
    };

    try {
        // ১. Firebase-এ গিফট ইভেন্ট পুশ করি
        const giftRef = push(ref(db, `rooms/${roomId}/gifts`));
        await set(giftRef, payload);

        // ২. Parent (Voice Club)-কে বলি animation চালাও
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'HOURFM_GIFT_FIRE', payload }, '*');
        }

        // UI reset
        document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
        const info = document.getElementById('selectedInfo');
        info.textContent = '✅ পাঠানো হয়েছে!';
        info.classList.remove('has-selection');
        document.getElementById('sendBtn').disabled = true;
        selectedGift = null;
        if (navigator.vibrate) navigator.vibrate(30);

    } catch (err) {
        console.error('Gift send failed:', err);
        alert('গিফট পাঠানো যায়নি, আবার চেষ্টা করুন');
    }
};
</script>
</body>
</html>
